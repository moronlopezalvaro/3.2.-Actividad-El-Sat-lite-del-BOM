<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lanzar ventana</title>
</head>

<body>
    <h1>Lanzar ventana satélite</h1>

    <button id="btnlanzar">Lanzar Ventana Satélite</button>

    <script>
        document.getElementById('btnlanzar').addEventListener('click', () => {
            const ancho = 400;
            const alto = 300;
            const left = Math.floor((screen.availWidth - ancho) / 2);
            const top = Math.floor((screen.availHeight - alto) / 2);
            window.open('satelite.html', '_blank', `width=${ancho},height=${alto},left=${left},top=${top},toolbar=no`);
        })
    </script>
</body>

</html>
