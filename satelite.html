<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventana satélite</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1> Ventana satélite</h1>
    <div id="bienvenida"></div>
    <button id="btnhistorial">Redirigir con Historial</button>
    <button id="btnsinhistorial">Redirigir sin Historial</button>
    <button id="destruir">Autodestrucción en 5 segundos</button>
    <p id="cuentaAtras"></p>

    <script>
        const URL_ILERNA = "https://www.ilerna.es"

        function mostrarSO() {
            const so = navigator.userAgent;
            if (so.includes("Windows")) return "Windows";
            if (so.includes("Mac")) return "Mac";
            if (so.includes("Linux")) return "Linux";
            return "Sistema desconocido";
        }

        function darBienvenida() {
            const so = mostrarSO();
            const parrafo = document.createElement("p");
            parrafo.textContent = "Bienvenido desde " + so;
            document.getElementById("bienvenida").appendChild(parrafo);
        }

        function mostrarCuentaAtras(texto) {
            document.getElementById("cuentaAtras").textContent = texto;
        }

        function ventanaMadre() {
            if (window.opener && !window.opener.closed) return true;
            mostrarCuentaAtras("No hay ventana principal: abre el satélite desde index.html.");
            return false;
        }

        document.getElementById("btnhistorial").addEventListener("click", () => {
            if (ventanaMadre()) {
                window.opener.location.assign(URL_ILERNA);
            }
        });

        document.getElementById("btnsinhistorial").addEventListener("click", () => {
            if (ventanaMadre()) {
                window.opener.location.replace(URL_ILERNA);
            }
        });

        document.getElementById("destruir").addEventListener("click", (evento) => {
            const SEGUNDOS = 5;
            let restantes = SEGUNDOS;

            evento.target.disabled = true;
            mostrarCuentaAtras("Autodestrucción en " + restantes + "...");

            const intervalo = setInterval(() => {
                restantes--;
                if (restantes > 0) {
                    mostrarCuentaAtras("Autodestrucción en " + restantes + "...");
                } else {
                    mostrarCuentaAtras("💥💥¡BOOOOOOOOOOM!💥💥");
                    clearInterval(intervalo);
                }
            }, 1000);

            setTimeout(() => {
                window.close();
            }, (SEGUNDOS + 1) * 1000);
        });

        darBienvenida();

    </script>
</body>

</html>
